# AGeDi training configuration template
# Pass this file to `agedi train-hydra` or `agedi.train_from_config()`.
# Individual keys can be overridden from the command line as KEY=VALUE pairs:
#   agedi train-hydra conf/train.yaml feature_size=128 epochs=200

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data_path: /path/to/train.traj   # Required – ASE-readable file

# Optional separate dataset used exclusively for regressor (force-field) training.
# Structures here are only forwarded through the regressor loss, never the diffusion
# loss.  Useful for adding non-equilibrium structures (e.g. from MD or NEB) that
# would be unsuitable as diffusion training targets.
# Set to null to disable (default).
regressor_data_path: null        # Optional – ASE-readable file

# ---------------------------------------------------------------------------
# Continue training from a checkpoint
# ---------------------------------------------------------------------------
# Path to a previously saved run directory (containing hparams.yaml) or
# directly to a .ckpt checkpoint file.  When set, the model architecture and
# weights are loaded from the checkpoint and training resumes from the saved
# state (optimiser, LR-scheduler, epoch counter).  Set to null to start
# training from scratch (default).
# Example – resume last checkpoint:  checkpoint: logs/version_0
# Example – specific checkpoint:     checkpoint: logs/version_0/checkpoints/best_model.ckpt
checkpoint: null

# ---------------------------------------------------------------------------
# Score-model architecture
# ---------------------------------------------------------------------------
model: PaiNN          # Currently only PaiNN is supported
cutoff: 6.0           # Neighbour-list cutoff in Å
feature_size: 64      # Embedding / feature dimension
n_blocks: 4           # Number of interaction blocks
n_rbf: 30             # Number of radial basis functions

# ---------------------------------------------------------------------------
# Diffusion / noiser configuration
# ---------------------------------------------------------------------------
noisers:
  - CellPositions     # One or more of:
                      #   Positions               : StandardNormal prior + Normal (gas-phase clusters)
                      #   CellPositions           : UniformCell prior + Normal (periodic bulk/surface)
                      #   ConfinedCellPositions   : UniformCellConfined prior + TruncatedNormal (Z-confined)
                      #   Types                   : discrete atom-type diffusion

# Number of element-type classes for the Types noiser (not counting the
# absorbing state at index 0).  Set to null to auto-detect from training data.
# Only relevant when 'Types' is in the noisers list.
n_classes: null

# SDE for position noisers.
#   ve : Variance-Exploding SDE (default)
#   vp : Variance-Preserving SDE
sde: ve

# Property conditioning (optional).  Set to "none" to disable.
conditioning: none
conditioning_type: scalar   # scalar | integer

# Z-confinement range [z_min, z_max] in Å – null to disable.
# Required when using the 'ConfinedCellPositions' noiser.
confinement: null

# Train a Forces regression head alongside the diffusion score.
# Set to true when training data contains per-atom DFT forces and you want to
# use force-field guidance during sampling (agedi sample --ff_guidance <scale>).
force_field: false

# Per-species reference energies subtracted from the energy target (only used
# when force_field is true).  Removing the large composition-dependent offset
# from the total energies makes the energy head much easier to fit; predicted
# energies stay on the absolute scale of the training data.
#   auto  : fit E_total ≈ Σ_Z n_Z·E⁰_Z from the training data (default)
#   null  : disable the subtraction
#   map   : explicit values keyed by chemical symbol or atomic number, e.g.
#             reference_energies:
#               Cu: -3.72
#               O:  -4.95
reference_energies: auto

# Loss used for the forces head: huber (default) | mse | mae.
# Huber is quadratic below huber_delta (in eV/Å) and linear above, so a few
# large force labels cannot dominate the gradient.
force_loss: huber
huber_delta: 0.01

# Weight of the force-field loss relative to the diffusion loss:
#   loss = diffusion_loss + regressor_loss_weight * regressor_loss
# Raise it to prioritise energy/force accuracy, lower it to keep the force field
# from dominating the score model.
regressor_loss_weight: 1.0

# ---------------------------------------------------------------------------
# Dataset splits and augmentation
# ---------------------------------------------------------------------------
batch_size: 64
train_split: 0.9      # Fraction (float) or absolute count (int) for training
val_split: 0.1        # Fraction (float) or absolute count (int) for validation
mask: none            # Masking strategy: none | MaskFixed
repeat: null          # Number of repetition levels (null = disabled)
repeat_epoch: null    # Epochs between repetition-level increases
canonical_cell: false  # Store cell in canonical lower-triangular form; set to true to canonicalize

# ---------------------------------------------------------------------------
# Optimiser
# ---------------------------------------------------------------------------
lr: 0.0001
lr_factor: 0.95
lr_patience: 100
weight_decay: 0.0
eps: 0.00001
guidance_weight: -1.0

# ---------------------------------------------------------------------------
# Trainer / logging
# ---------------------------------------------------------------------------
epochs: -1            # -1 = unlimited (stop by max_time or manually)
max_time: 24          # Wall-clock limit in hours (null = no limit)
gradient_clip_val: 10.0

logger: tensorboard   # tensorboard | wandb
log_dir: logs
project: agedi        # WandB project name
name: agedi           # WandB run display name
log_interval: 10
progress_bar: false
